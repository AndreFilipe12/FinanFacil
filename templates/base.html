<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}FinanFácil{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">

    <div class="d-flex">


        <!-- MENU LATERAL -->
        <aside class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">

            <h3 class="mb-4 fw-bold">

                <span class="text-success">
                    ◆
                </span>

                <span class="text-white">
                    Finan
                </span>

                <span class="text-success">
                    Fácil
                </span>

            </h3>


            <div class="mb-4">

                <small class="text-secondary">
                    MENU PRINCIPAL
                </small>

            </div>


            <nav class="nav flex-column gap-2">

                <a href="{% url 'home' %}" class="nav-link text-white bg-primary rounded">
                    🏠 Home
                </a>

                <a href="{% url 'transacoes' %}" class="nav-link text-white">
                    💳 Transações
                </a>

                <a href="{% url 'relatorios' %}" class="nav-link text-white">
                    📊 Relatórios
                </a>

                <a href="{% url 'analises' %}" class="nav-link text-white">
                    📈 Análises
                </a>

                <a href="#" class="nav-link text-white">
                    🎯 Metas
                </a>

            </nav>


            <hr class="border-secondary">


            <nav class="nav flex-column">

                <a href="#" class="nav-link text-white">
                    ⚙️ Configurações
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-grow-1">


            <!-- CABEÇALHO -->
            <header class="bg-white border-bottom p-3">

                <div class="container-fluid">

                    <div class="d-flex justify-content-end">

                        <span class="text-muted">
                            👤 Filipe
                        </span>

                    </div>

                </div>

            </header>


            <!-- CONTEÚDO DA PÁGINA -->
            <div class="container-fluid p-4">

                {% block content %}
                {% endblock %}

            </div>

        </main>

    </div>

</body>

</html>
